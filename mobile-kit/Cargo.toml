[package]
name = "craft-mobile-kit"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Shared Android shell for the Craft mobile ports: touch widgets, zoom/pan viewer, theme, and the Android platform bridge (file picker, gallery save, insets, back button)."

# Built inside each upstream Craft workspace (CI copies this folder next to it), so the egui
# version and the workspace's [patch] of egui/winit apply here too.
[dependencies]
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
android_logger = "0.15"
